<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情緒辨別翻牌遊戲 | 薩提爾覺察版</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="app" class="max-w-5xl mx-auto p-4 md:p-10">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">情緒 & 期待翻牌遊戲</h1>
            <p class="text-slate-500 mt-3 text-lg">透過配對，探索冰山下的內在世界</p>
            <div class="mt-6 flex justify-center gap-4">
                <button @click="initGame('Student')" class="px-6 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-full font-bold shadow-lg transition">學生版</button>
                <button @click="initGame('Adult')" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-bold shadow-lg transition">成人版</button>
            </div>
        </header>

        <div v-if="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
            <p class="mt-4 text-slate-500">正在從雲端讀取卡片...</p>
        </div>
        
        <div v-else-if="gameCards.length" class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div v-for="(card, index) in gameCards" :key="index" class="relative h-48 cursor-pointer" @click="flipCard(card)">
                <div class="card-inner w-full h-full relative shadow-xl rounded-2xl" :class="{'is-flipped': card.isFlipped || card.isMatched}">
                    <div class="card-front bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white text-5xl font-serif">?</div>
                    <div class="card-back bg-white border-2 border-indigo-100 rounded-2xl p-6 flex flex-col items-center justify-center text-center">
                        <span class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2">{{ card.Category }}</span>
                        <p class="text-lg font-semibold text-slate-800 leading-snug">{{ card.Content }}</p>
                    </div>
                </div>
            </div>
        </div>

        <transition name="fade">
            <div v-if="showInsight" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
                <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl transform transition-all scale-100">
                    <div class="text-center">
                        <div class="inline-block p-3 bg-purple-100 rounded-full mb-4">
                            <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">覺察時刻</h3>
                        <p class="text-slate-600 leading-relaxed italic mb-8">"{{ activeInsight }}"</p>
                        <button @click="showInsight = false" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition shadow-lg">繼續探索</button>
                    </div>
                </div>
            </div>
        </transition>

        <div v-if="isWin" class="mt-12 text-center p-8 bg-green-50 rounded-3xl border-2 border-green-200">
            <h2 class="text-3xl font-bold text-green-700">太棒了！完全解開！🎉</h2>
            <p class="text-green-600 mt-2">你已經成功辨識了所有內在狀態。</p>
            <button @click="resetGame" class="mt-6 px-8 py-3 bg-green-600 text-white rounded-full font-bold shadow-md">再玩一局</button>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;
        const GAS_URL = '你的_GAS_網址'; 

        createApp({
            setup() {
                const gameCards = ref([]);
                const flippedCards = ref([]);
                const loading = ref(false);
                const showInsight = ref(false);
                const activeInsight = ref("");

                const isWin = computed(() => gameCards.value.length > 0 && gameCards.value.every(c => c.isMatched));

                const initGame = async (target) => {
                    loading.value = true;
                    try {
                        const res = await fetch(`${GAS_URL}?target=${target}`);
                        const allData = await res.json();
                        
                        // 1. 隨機選出 4 對 (共 8 張)
                        // 邏輯：先找出所有「詞彙」，隨機抽 4 個，再找對應 MatchID
                        const vocabulary = allData.filter(c => c.Type === '詞彙').sort(() => Math.random() - 0.5).slice(0, 4);
                        const pairs = [];
                        vocabulary.forEach(v => {
                            pairs.push({...v, isFlipped: false, isMatched: false});
                            const match = allData.find(m => m.CardID == v.MatchID);
                            if (match) pairs.push({...match, isFlipped: false, isMatched: false});
                        });

                        // 2. 打亂順序
                        gameCards.value = pairs.sort(() => Math.random() - 0.5);
                    } catch (e) { alert('載入失敗，請確認 GAS 網址與權限'); }
                    loading.value = false;
                };

                const flipCard = (card) => {
                    if (card.isFlipped || card.isMatched || flippedCards.value.length === 2) return;
                    card.isFlipped = true;
                    flippedCards.value.push(card);
                    if (flippedCards.value.length === 2) checkMatch();
                };

                const checkMatch = () => {
                    const [c1, c2] = flippedCards.value;
                    if (c1.MatchID == c2.CardID || c2.MatchID == c1.CardID) {
                        setTimeout(() => {
                            c1.isMatched = c2.isMatched = true;
                            if (c1.Insight || c2.Insight) {
                                activeInsight.value = c1.Insight || c2.Insight;
                                showInsight.value = true;
                            }
                            flippedCards.value = [];
                        }, 500);
                    } else {
                        setTimeout(() => {
                            c1.isFlipped = c2.isFlipped = false;
                            flippedCards.value = [];
                        }, 1000);
                    }
                };

                const resetGame = () => { gameCards.value = []; };

                return { gameCards, loading, initGame, flipCard, isWin, resetGame, showInsight, activeInsight };
            }
        }).mount('#app');
    </script>
</body>
</html>
