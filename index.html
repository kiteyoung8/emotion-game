<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情緒辨別翻牌遊戲 | 深度覺察版</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [v-cloak] { display: none; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .card-back { transform: rotateY(180deg); }
        
        /* 選取時的光暈效果 */
        .selected-glow {
            box-shadow: 0 0 20px 5px rgba(245, 158, 11, 0.6);
            border: 3px solid #F59E0B !important;
            transform: scale(1.05);
            z-index: 10;
        }

        .fade-enter-active, .fade-leave-active { transition: opacity 0.5s; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-900">
    <div id="app" v-cloak class="max-w-5xl mx-auto p-4 md:p-10">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">情緒與期待覺察遊戲</h1>
            <p class="text-slate-500 mt-3 text-lg">降低壓力，看見冰山下的內在風景</p>
            
            <div class="mt-8 flex flex-col items-center gap-6">
                <div class="flex gap-4">
                    <button @click="initGame('Student')" 
                            class="px-8 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-full font-bold shadow-lg transition-all active:scale-95">
                        學生版
                    </button>
                    <button @click="initGame('Adult')" 
                            class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-bold shadow-lg transition-all active:scale-95">
                        成人版
                    </button>
                </div>

                <div class="flex items-center gap-3 bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-200">
                    <span class="text-slate-600 font-medium">🧘 全開覺察模式 (不考驗記憶)</span>
                    <button @click="isZenMode = !isZenMode" 
                            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none"
                            :class="isZenMode ? 'bg-green-500' : 'bg-slate-300'">
                        <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
                              :class="isZenMode ? 'translate-x-6' : 'translate-x-1'"></span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <div v-if="loading" class="text-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                <p class="mt-4 text-slate-500 font-medium">正在為您準備覺察卡片...</p>
            </div>
            
            <div v-else-if="gameCards.length" class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div v-for="(card, index) in gameCards" :key="index" 
                     class="relative h-48 cursor-pointer" 
                     @click="handleCardClick(card)">
                    <div class="card-inner w-full h-full relative rounded-2xl transition-all duration-300"
                         :class="[
                            (card.isFlipped || card.isMatched) ? 'is-flipped' : '',
                            flippedCards.includes(card) ? 'selected-glow' : 'shadow-xl'
                         ]">
                        
                        <div class="card-front bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white text-5xl font-serif">
                            ?
                        </div>
                        
                        <div class="card-back bg-white border-2 rounded-2xl p-6 flex flex-col items-center justify-center text-center shadow-inner"
                             :class="card.isMatched ? 'border-green-200 bg-green-50' : 'border-indigo-100'">
                            <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-2">{{ card.Category }}</span>
                            <p class="text-md md:text-lg font-semibold text-slate-800 leading-snug">{{ card.Content }}</p>
                            <div v-if="card.isMatched" class="mt-2 text-green-500 text-xs font-bold">✓ 已配對</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div v-else class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                <p class="text-slate-400">請選擇一個版本開始探索</p>
            </div>
        </main>

        <transition name="fade">
            <div v-if="showInsight" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-6 z-50">
                <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl">
                    <div class="text-center">
                        <div class="inline-block p-3 bg-amber-100 rounded-full mb-4">
                            <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5S19.832 5.477 21 6.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">覺察時刻</h3>
                        <p class="text-slate-600 leading-relaxed italic mb-8">"{{ activeInsight }}"</p>
                        
                        <div class="text-left mb-6">
                            <label class="block text-sm font-bold text-slate-500 mb-2">
                                {{ currentTarget === 'Student' ? '這讓你想到了什麼？' : '這個情境對你的影響是什麼？' }}
                            </label>
                            <textarea v-model="userNote" 
                                      class="w-full border-2 border-slate-100 rounded-xl p-3 focus:border-indigo-500 outline-none transition text-slate-700"
                                      rows="3" :placeholder="currentTarget === 'Student' ? '寫下一句話...' : '寫下你的發現...'"></textarea>
                        </div>

                        <button @click="submitNote" 
                                :disabled="isSubmitting"
                                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold transition shadow-lg disabled:bg-slate-300">
                            {{ isSubmitting ? '紀錄中...' : '儲存並繼續' }}
                        </button>
                    </div>
                </div>
            </div>
        </transition>

        <div v-if="isWin" class="mt-12 text-center p-10 bg-gradient-to-r from-green-50 to-emerald-50 rounded-3xl border-2 border-green-200 shadow-sm">
            <h2 class="text-3xl font-bold text-green-700 mb-2">圓滿完成 🎉</h2>
            <p class="text-green-600">你已經完成當前的覺察練習，做得很好。</p>
            <button @click="resetGame" class="mt-6 px-10 py-3 bg-green-600 hover:bg-green-700 text-white rounded-full font-bold shadow-md transition">再玩一次</button>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;
        
        // 🚨 請替換成你的 GAS Web App URL 🚨
        const GAS_URL = '你的_GAS_部署網址'; 

        createApp({
            setup() {
                const gameCards = ref([]);
                const flippedCards = ref([]);
                const loading = ref(false);
                const showInsight = ref(false);
                const activeInsight = ref("");
                const activeCard = ref(null);
                const userNote = ref("");
                const isSubmitting = ref(false);
                const isZenMode = ref(false);
                const currentTarget = ref("");

                const isWin = computed(() => gameCards.value.length > 0 && gameCards.value.every(c => c.isMatched));

                const initGame = async (target) => {
                    loading.value = true;
                    currentTarget.value = target;
                    gameCards.value = [];
                    try {
                        const res = await fetch(`${GAS_URL}?target=${target}`);
                        const allData = await res.json();
                        
                        // 隨機選出 4 對詞彙與對應內容
                        const vocabulary = allData.filter(c => c.Type === '詞彙').sort(() => Math.random() - 0.5).slice(0, 4);
                        const pairs = [];
                        vocabulary.forEach(v => {
                            const match = allData.find(m => m.CardID == v.MatchID);
                            if (match) {
                                pairs.push({...v, isFlipped: isZenMode.value, isMatched: false});
                                pairs.push({...match, isFlipped: isZenMode.value, isMatched: false});
                            }
                        });

                        // 洗牌
                        gameCards.value = pairs.sort(() => Math.random() - 0.5);
                    } catch (e) { 
                        alert('連線失敗，請檢查 GAS 網址是否正確且權限已開放'); 
                    }
                    loading.value = false;
                };

                const handleCardClick = (card) => {
                    if (card.isMatched || flippedCards.value.includes(card) || (flippedCards.value.length === 2)) return;
                    
                    // 普通模式下需要翻牌
                    if (!isZenMode.value) card.isFlipped = true;
                    
                    flippedCards.value.push(card);

                    if (flippedCards.value.length === 2) {
                        checkMatch();
                    }
                };

                const checkMatch = () => {
                    const [c1, c2] = flippedCards.value;
                    if (c1.MatchID == c2.CardID || c2.MatchID == c1.CardID) {
                        setTimeout(() => {
                            c1.isMatched = c2.isMatched = true;
                            activeInsight.value = c1.Insight || c2.Insight || "很棒的觀察！";
                            activeCard.value = c1;
                            showInsight.value = true;
                            flippedCards.value = [];
                        }, 500);
                    } else {
                        setTimeout(() => {
                            // 非全開模式才需要翻回去
                            if (!isZenMode.value) {
                                c1.isFlipped = c2.isFlipped = false;
                            }
                            flippedCards.value = [];
                        }, 1000);
                    }
                };

                const submitNote = async () => {
                    isSubmitting.value = true;
                    try {
                        // 使用 no-cors 模式傳送資料到 GAS
                        await fetch(GAS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                target: currentTarget.value,
                                category: activeCard.value.Category,
                                content: activeCard.value.Content,
                                note: userNote.value
                            })
                        });
                    } catch (e) {
                        console.log("Note stored via GAS proxy");
                    } finally {
                        userNote.value = "";
                        isSubmitting.value = false;
                        showInsight.value = false;
                    }
                };

                const resetGame = () => {
                    gameCards.value = [];
                    currentTarget.value = "";
                };

                return { 
                    gameCards, loading, initGame, handleCardClick, isWin, 
                    resetGame, showInsight, activeInsight, userNote, 
                    isSubmitting, submitNote, isZenMode, flippedCards, currentTarget 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
