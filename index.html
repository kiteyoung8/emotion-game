<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情緒辨識與狀態覺察系統</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [v-cloak] { display: none; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; width: 100%; height: 100%; border-radius: 1rem; }
        .card-back { transform: rotateY(180deg); }
        .selected-glow { box-shadow: 0 0 15px 5px rgba(99, 102, 241, 0.5); border: 2px solid #6366f1 !important; }
        .fade-enter-active, .fade-leave-active { transition: all 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="app" v-cloak class="max-w-4xl mx-auto p-6 md:p-12">
        
        <section v-if="step === 'target'" class="text-center py-20">
            <h1 class="text-4xl font-black mb-4">我是...</h1>
            <p class="text-slate-500 mb-10">開始您的內在覺察旅程</p>
            <div class="flex justify-center gap-6">
                <button @click="selectTarget('Student')" class="group p-8 bg-white border-2 border-sky-100 rounded-3xl hover:border-sky-500 transition shadow-sm">
                    <span class="text-5xl block mb-4 group-hover:scale-110 transition">🎒</span>
                    <span class="text-xl font-bold">學生版</span>
                </button>
                <button @click="selectTarget('Adult')" class="group p-8 bg-white border-2 border-indigo-100 rounded-3xl hover:border-indigo-500 transition shadow-sm">
                    <span class="text-5xl block mb-4 group-hover:scale-110 transition">💼</span>
                    <span class="text-xl font-bold">成人版</span>
                </button>
            </div>
        </section>

        <section v-if="step === 'scene'" class="text-center py-20">
            <button @click="step = 'target'" class="text-slate-400 mb-4 hover:underline">← 返回選擇身份</button>
            <h2 class="text-3xl font-black mb-10">選擇您目前想關注的場景</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div v-for="s in availableScenes" :key="s.name" @click="selectScene(s.name)"
                     class="p-10 bg-white rounded-3xl border-2 border-slate-100 hover:border-indigo-500 cursor-pointer shadow-sm transition">
                    <span class="text-4xl mb-4 block">{{ s.icon }}</span>
                    <h3 class="text-2xl font-bold mb-2">{{ s.label }}</h3>
                    <p class="text-slate-400">{{ s.desc }}</p>
                </div>
            </div>
        </section>

        <section v-if="step === 'game'">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <span class="text-xs font-bold text-indigo-500 uppercase tracking-widest">{{ currentTarget }} - {{ currentScene }}</span>
                    <h2 class="text-2xl font-black">情緒與狀態配對</h2>
                </div>
                <div class="flex items-center gap-2 text-sm bg-white px-4 py-2 rounded-full border shadow-sm">
                    🧘 全開模式 <button @click="isZenMode = !isZenMode; resetBoard()" :class="isZenMode ? 'bg-green-500' : 'bg-slate-300'" class="w-10 h-5 rounded-full relative transition"><span :class="isZenMode ? 'translate-x-5' : 'translate-x-1'" class="absolute top-0.5 left-0 w-4 h-4 bg-white rounded-full transition"></span></button>
                </div>
            </header>

            <div v-if="loading" class="text-center py-20 animate-pulse text-slate-400">正在調用情境資料...</div>

            <div v-else class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div v-for="(card, i) in gameCards" :key="i" class="relative h-44" @click="handleFlip(card)">
                    <div class="card-inner w-full h-full relative" :class="[(card.isFlipped || card.isMatched) ? 'is-flipped' : '', flippedCards.includes(card) ? 'selected-glow' : 'shadow-md']">
                        <div class="card-front bg-slate-200 flex items-center justify-center text-3xl font-serif text-slate-400">?</div>
                        <div class="card-back p-4 border-2 flex flex-col items-center justify-center text-center bg-white" :class="card.isMatched ? 'border-green-200' : 'border-indigo-50'">
                            <span class="text-[9px] font-bold text-indigo-400 mb-1 uppercase tracking-tighter">{{ card.Type }}</span>
                            <p class="text-sm font-bold text-slate-700 leading-tight">{{ card.Content }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <transition name="fade">
            <div v-if="showInsight" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-6 z-50">
                <div class="bg-white rounded-3xl p-8 max-w-md w-full">
                    <div class="flex justify-center mb-4 text-amber-500"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round"></path></svg></div>
                    <h3 class="text-center text-xl font-bold mb-2">覺察筆記</h3>
                    <p class="text-slate-500 text-center italic mb-6">"{{ activeInsight }}"</p>
                    <textarea v-model="userNote" class="w-full border-2 border-slate-100 rounded-xl p-4 mb-6 focus:border-indigo-500 outline-none" rows="3" placeholder="這種感覺或狀態，讓你想到最近的哪件事？"></textarea>
                    <button @click="saveNote" :disabled="isSaving" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold disabled:bg-slate-300">儲存並繼續</button>
                </div>
            </div>
        </transition>

        <section v-if="isWin" class="text-center py-20 bg-white rounded-3xl shadow-xl border p-10 mt-10">
            <h2 class="text-3xl font-bold text-slate-800 mb-4">今日探索完畢 🎉</h2>
            <p class="text-slate-500 mb-8">您已經成功辨識並歸納了本場景的所有情緒狀態。</p>
            <button @click="resetToStart" class="px-10 py-4 bg-slate-800 text-white rounded-full font-bold hover:bg-black transition">回首頁重新探索</button>
        </section>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;
        const GAS_URL = '你的_GAS_網址'; 

        createApp({
            setup() {
                const step = ref('target');
                const currentTarget = ref('');
                const currentScene = ref('');
                const isZenMode = ref(false);
                const loading = ref(false);
                const gameCards = ref([]);
                const flippedCards = ref([]);
                const showInsight = ref(false);
                const activeInsight = ref('');
                const activeCard = ref(null);
                const userNote = ref('');
                const isSaving = ref(false);

                const sceneMap = {
                    Student: [
                        { name: 'School', label: '學校生活', icon: '🏫', desc: '人際、成績、師生關係' },
                        { name: 'Home', label: '家庭關係', icon: '🏠', desc: '父母、手足、生活習慣' }
                    ],
                    Adult: [
                        { name: 'Workplace', label: '職場壓力', icon: '🏢', desc: '績效、同事、職涯焦慮' },
                        { name: 'Home', label: '家庭生活', icon: '🏡', desc: '伴侶、親職、內在期待' }
                    ]
                };

                const availableScenes = computed(() => sceneMap[currentTarget.value] || []);
                const isWin = computed(() => gameCards.value.length > 0 && gameCards.value.every(c => c.isMatched));

                const selectTarget = (t) => { currentTarget.value = t; step.value = 'scene'; };
                const selectScene = (s) => { currentScene.value = s; step.value = 'game'; loadCards(); };

                const loadCards = async () => {
                    loading.value = true;
                    try {
                        const res = await fetch(`${GAS_URL}?target=${currentTarget.value}&scene=${currentScene.value}`);
                        const data = await res.json();
                        // 隨機抽 4 對 (情緒 vs 狀態)
                        const emoCards = data.filter(c => c.Type === '情緒').sort(() => Math.random() - 0.5).slice(0, 4);
                        const pairs = [];
                        emoCards.forEach(e => {
                            const state = data.find(s => s.CardID == e.MatchID);
                            if (state) {
                                const base = { isMatched: false, isFlipped: isZenMode.value };
                                pairs.push({...e, ...base}, {...state, ...base});
                            }
                        });
                        gameCards.value = pairs.sort(() => Math.random() - 0.5);
                    } catch (e) { alert('載入失敗，請確認 GAS URL 與權限設定'); }
                    loading.value = false;
                };

                const handleFlip = (card) => {
                    if (card.isMatched || flippedCards.value.includes(card) || flippedCards.value.length >= 2) return;
                    if (!isZenMode.value) card.isFlipped = true;
                    flippedCards.value.push(card);
                    if (flippedCards.value.length === 2) {
                        const [c1, c2] = flippedCards.value;
                        if (c1.MatchID == c2.CardID || c2.MatchID == c1.CardID) {
                            setTimeout(() => {
                                c1.isMatched = c2.isMatched = true;
                                activeInsight.value = c1.Insight || c2.Insight || "不錯的覺察！";
                                activeCard.value = c1; showInsight.value = true;
                                flippedCards.value = [];
                            }, 500);
                        } else {
                            setTimeout(() => {
                                if (!isZenMode.value) { c1.isFlipped = c2.isFlipped = false; }
                                flippedCards.value = [];
                            }, 1000);
                        }
                    }
                };

                const saveNote = async () => {
                    isSaving.value = true;
                    await fetch(GAS_URL, {
                        method: 'POST', mode: 'no-cors',
                        body: JSON.stringify({
                            target: currentTarget.value, scene: currentScene.value,
                            category: activeCard.value.SubCategory,
                            content: activeCard.value.Content, note: userNote.value
                        })
                    });
                    userNote.value = ""; isSaving.value = false; showInsight.value = false;
                };

                const resetToStart = () => { step.value = 'target'; gameCards.value = []; };
                const resetBoard = () => { gameCards.value.forEach(c => c.isFlipped = isZenMode.value); };

                return { step, currentTarget, currentScene, availableScenes, selectTarget, selectScene, loading, gameCards, isZenMode, handleFlip, flippedCards, isWin, showInsight, activeInsight, userNote, isSaving, saveNote, resetToStart, resetBoard };
            }
        }).mount('#app');
    </script>
</body>
</html>
