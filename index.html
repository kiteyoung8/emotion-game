<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情緒與期待覺察遊戲</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [v-cloak] { display: none; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .card-back { transform: rotateY(180deg); }
        .selected-glow {
            box-shadow: 0 0 20px 5px rgba(245, 158, 11, 0.6);
            border: 3px solid #F59E0B !important;
            transform: scale(1.05); z-index: 10;
        }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.4s; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen antialiased text-slate-900">
    <div id="app" v-cloak class="max-w-5xl mx-auto p-4 md:p-10">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">內在冰山覺察遊戲</h1>
            <p class="text-slate-500 mt-3 text-lg">連結情緒、期待與渴望</p>
            
            <div class="mt-8 flex flex-col items-center gap-6">
                <div class="flex gap-4">
                    <button @click="initGame('Student')" class="px-8 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-full font-bold shadow-lg transition active:scale-95">學生版</button>
                    <button @click="initGame('Adult')" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-bold shadow-lg transition active:scale-95">成人版</button>
                </div>

                <div class="flex items-center gap-3 bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-200">
                    <span class="text-slate-600 font-medium">🧘 全開覺察模式 (不考驗記憶)</span>
                    <button @click="isZenMode = !isZenMode" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors" :class="isZenMode ? 'bg-green-500' : 'bg-slate-300'">
                        <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform" :class="isZenMode ? 'translate-x-6' : 'translate-x-1'"></span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <div v-if="loading" class="text-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                <p class="mt-4 text-slate-500">正在開啟覺察之窗...</p>
            </div>
            
            <div v-else-if="gameCards.length" class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div v-for="(card, index) in gameCards" :key="index" class="relative h-48 cursor-pointer" @click="handleCardClick(card)">
                    <div class="card-inner w-full h-full relative rounded-2xl transition-all"
                         :class="[(card.isFlipped || card.isMatched) ? 'is-flipped' : '', flippedCards.includes(card) ? 'selected-glow' : 'shadow-xl']">
                        <div class="card-front bg-gradient-to-br from-slate-400 to-slate-600 rounded-2xl flex items-center justify-center text-white text-5xl">?</div>
                        <div class="card-back bg-white border-2 rounded-2xl p-6 flex flex-col items-center justify-center text-center" :class="card.isMatched ? 'border-green-200 bg-green-50' : 'border-slate-100'">
                            <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-2">{{ card.Category }}</span>
                            <p class="text-md font-semibold text-slate-800">{{ card.Content }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <transition name="fade">
            <div v-if="showInsight" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-6 z-50">
                <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl">
                    <div class="text-center">
                        <h3 class="text-xl font-bold text-slate-800 mb-2">💡 覺察時刻</h3>
                        <p class="text-slate-600 italic mb-6">"{{ activeInsight }}"</p>
                        <div class="text-left mb-6">
                            <label class="block text-sm font-bold text-slate-500 mb-2">這讓你聯想到什麼？</label>
                            <textarea v-model="userNote" class="w-full border-2 border-slate-100 rounded-xl p-3 outline-none focus:border-indigo-500" rows="3"></textarea>
                        </div>
                        <button @click="submitNote" :disabled="isSubmitting" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg disabled:bg-slate-300">儲存並繼續</button>
                    </div>
                </div>
            </div>
        </transition>

        <div v-if="isWin" class="mt-12 text-center p-10 bg-white rounded-3xl border shadow-sm">
            <h2 class="text-3xl font-bold text-slate-800 mb-2">圓滿完成 🎉</h2>
            <button @click="resetGame" class="mt-6 px-10 py-3 bg-indigo-600 text-white rounded-full font-bold">重新開始</button>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;
        const GAS_URL = '你的_GAS_網址'; 

        createApp({
            setup() {
                const gameCards = ref([]);
                const flippedCards = ref([]);
                const loading = ref(false);
                const showInsight = ref(false);
                const activeInsight = ref("");
                const activeCard = ref(null);
                const userNote = ref("");
                const isSubmitting = ref(false);
                const isZenMode = ref(false);
                const currentTarget = ref("");

                const isWin = computed(() => gameCards.value.length > 0 && gameCards.value.every(c => c.isMatched));

                const initGame = async (target) => {
                    loading.value = true;
                    currentTarget.value = target;
                    gameCards.value = [];
                    try {
                        const res = await fetch(`${GAS_URL}?target=${target}`);
                        const allData = await res.json();
                        const vocabulary = allData.filter(c => c.Type === '詞彙').sort(() => Math.random() - 0.5).slice(0, 4);
                        const pairs = [];
                        vocabulary.forEach(v => {
                            const match = allData.find(m => Number(m.CardID) === Number(v.MatchID));
                            if (match) {
                                const base = { isMatched: false, isFlipped: isZenMode.value };
                                pairs.push({...v, ...base}, {...match, ...base});
                            }
                        });
                        // Fisher-Yates 洗牌
                        for (let i = pairs.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
                        }
                        gameCards.value = pairs;
                    } catch (e) { alert('連線失敗'); }
                    loading.value = false;
                };

                const handleCardClick = (card) => {
                    if (card.isMatched || flippedCards.value.includes(card) || flippedCards.value.length >= 2) return;
                    if (!isZenMode.value) card.isFlipped = true;
                    flippedCards.value.push(card);
                    if (flippedCards.value.length === 2) {
                        const [c1, c2] = flippedCards.value;
                        if (c1.MatchID == c2.CardID || c2.MatchID == c1.CardID) {
                            setTimeout(() => {
                                c1.isMatched = c2.isMatched = true;
                                activeInsight.value = c1.Insight || c2.Insight || "很棒的覺察！";
                                activeCard.value = c1;
                                showInsight.value = true;
                                flippedCards.value = [];
                            }, 500);
                        } else {
                            setTimeout(() => {
                                if (!isZenMode.value) { c1.isFlipped = c2.isFlipped = false; }
                                flippedCards.value = [];
                            }, 1000);
                        }
                    }
                };

                const submitNote = async () => {
                    isSubmitting.value = true;
                    try {
                        await fetch(GAS_URL, {
                            method: 'POST', mode: 'no-cors',
                            body: JSON.stringify({
                                target: currentTarget.value,
                                category: activeCard.value.Category,
                                content: activeCard.value.Content,
                                note: userNote.value
                            })
                        });
                    } finally {
                        userNote.value = ""; isSubmitting.value = false; showInsight.value = false;
                    }
                };

                const resetGame = () => { gameCards.value = []; };

                return { gameCards, loading, initGame, handleCardClick, isWin, resetGame, showInsight, activeInsight, userNote, isSubmitting, submitNote, isZenMode, flippedCards, currentTarget };
            }
        }).mount('#app');
    </script>
</body>
</html>
